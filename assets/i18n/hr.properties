# Reolink Doorbell Intercom: the plugin's own texts in Hrvatski. See the README's Translations.
# A line starting with "# TODO key=" still needs translating: remove "# TODO ", then translate after the =.
# A "# TODO update" line means the English text changed: fix the translation below it, then remove the TODO lines.
# A line starting with #: says where the text below it appears. Keep the {placeholders} as they are.
# Or use the translation page, which does all of this for you: see the README.

# Call screen
#: Button on the call screen while it rings: answers, turning on the speaker and the microphone.
answer=Odgovori
#: Button on the call screen: hear the doorbell without talking. In a call it turns the door sound on and off.
speaker=Zvučnik
#: Button in a call: turns your microphone on and off.
microphone=Mikrofon
#: Button while it rings: closes the call screen without answering.
hangUp=Odbij
#: Button in a call: ends the call and closes the call screen.
endCall=Završi poziv
#: Read out by screen readers after a button name, such as "Speaker, on".
on=uključeno
#: Read out by screen readers after a button name, such as "Speaker, off".
off=isključeno
#: Small red label at the top while the doorbell can hear you.
microphoneActive=Mikrofon aktivan
#: Button in push-to-talk mode: the doorbell hears you only while you hold it. Keep it short.
holdToTalk=Govori
#: Shown for a moment after a tap on Talk that was too short.
holdToTalkHint=Držite tipku za govor
#: Shown over the picture area while the call screen connects.
connecting=Povezivanje sa zvonom…
#: Shown when the doorbell is connected but has not sent a picture yet.
noPictureYet=Zvono još nije poslalo sliku
#: Shown over the picture area. Two lines: a short title, then the reason. Keep the \n between them.
noVideo=Nema slike\nZvono ne odgovara
#: Shown over a picture that stopped moving. Two lines: title, then reason. Keep the \n.
videoStopped=Slika je zamrznuta\nVeza sa zvonom je izgubljena
#: Shown when this device cannot decode the video. Two lines: title, then reason. Keep the \n.
videoNotShown=Nema slike\nOvaj uređaj ne može reproducirati video
#: Shown when the doorbell sends H.265 video. Two lines: title, then reason. Keep the \n.
videoH265=Nema slike\nZvono šalje H.265 video koji preglednik ne može reproducirati
#: Short notice at the top of the call screen when the sound from the doorbell stops.
doorbellSoundStopped=Nema zvuka sa zvona
#: Short notice at the top of the call screen when the doorbell stops receiving your voice.
voiceNotThrough=Vaš glas ne dopire do zvona
#: Short notice at the top of the call screen when no microphone works.
noMicrophone=Mikrofon ne radi
#: The doorbell's name at the top of the call screen when the user did not give one.
defaultName=Ulazna vrata

# Cards
#: Label of a quick-action card the user did not name.
cardAction=Radnja
#: Under a quick-action card that must be held, so it is not run by accident.
holdToRun=Držite za pokretanje
#: Under a quick-action card for a moment after its action ran.
cardDone=Gotovo
#: Under a quick-action card for a moment when its action failed.
cardFailed=Neuspjelo
#: Under a quick-action card when the Kiosk Satellite app is too old for it.
cardsNeedNewerKs=Potreban noviji Kiosk Satellite
#: A Home Assistant device's state when Home Assistant cannot reach it.
unavailable=Nedostupno
#: A Home Assistant device's state when it has none yet.
unknown=Nepoznato
#: State of a light or switch, under its card.
stateOn=Uključeno
#: State of a light or switch, under its card.
stateOff=Isključeno
#: State of a door, window, gate or cover, under its card.
stateOpen=Otvoreno
#: State of a door, window, gate or cover, under its card.
stateClosed=Zatvoreno
#: State of a motion or presence sensor that sees something.
stateDetected=Otkriveno
#: State of a motion or presence sensor that sees nothing: "no motion".
stateClear=Nema pokreta
#: State of a lock.
state.locked=Zaključano
#: State of a lock.
state.unlocked=Otključano
#: State of a lock while it locks.
state.locking=Zaključavanje…
#: State of a lock while it unlocks.
state.unlocking=Otključavanje…
#: State of a lock that got stuck.
state.jammed=Zaglavljeno
#: State of a garage door, gate or cover while it opens.
state.opening=Otvaranje…
#: State of a garage door, gate or cover while it closes.
state.closing=Zatvaranje…
#: State of an alarm system that is off.
state.disarmed=Isključen
#: State of an alarm system armed while people are at home.
state.armed_home=Uključen – kod kuće
#: State of an alarm system armed while nobody is home.
state.armed_away=Uključen – odsutan
#: State of an alarm system armed for the night.
state.armed_night=Uključen – noćni način
#: State of an alarm system armed for a holiday.
state.armed_vacation=Uključen – odmor
#: State of an alarm system armed with some zones left out.
state.armed_custom_bypass=Uključen – prilagođeno
#: State of an alarm system while it arms.
state.arming=Uključivanje…
#: State of an alarm system while it disarms.
state.disarming=Isključivanje…
#: State of an alarm system counting down before it goes off.
state.pending=Na čekanju…
#: State of an alarm system that went off.
state.triggered=Aktiviran alarm

# Readings and status
#: Name of a reading in the plugin's status in Kiosk Satellite.
connectionReading=Veza sa zvonom
#: Name of a reading: when the doorbell last rang.
lastRingReading=Zadnje zvonjenje
#: Name of a reading: how long the picture took to show after the last ring.
firstPictureReading=Prva slika
#: Value of the Doorbell connection reading.
connected=povezano
#: Value of the Doorbell connection reading.
connectingState=povezivanje
#: Value of the Doorbell connection reading before the settings are filled in.
notConfigured=nije postavljeno
#: Value of the Last ring reading before the first ring.
noneYet=još nema
#: Value of the First picture reading while the picture is on its way.
waiting=čekanje
#: Value of the First picture reading. {millis} is a number of milliseconds.
afterRing={millis} ms nakon zvonjenja
#: The plugin's status before the settings are filled in.
enterSettings=Unesite adresu, korisničko ime i lozinku zvona
#: The plugin's status. {name} is the doorbell's name.
connectedTo=Povezano s uređajem {name}
#: The plugin's status when something is wrong. {detail} is one of the short texts below.
doorbellProblem=Zvono: {detail}
#: Fills {detail} above: the doorbell stopped answering.
problemNotAnswering=ne odgovara
#: Fills {detail} above: the doorbell cannot be reached on the network.
problemUnreachable=nije dostupno
#: Fills {detail} above.
problemLogin=korisničko ime ili lozinka odbijeni
#: Fills {detail} above: the doorbell is linked to a Reolink cloud account, which blocks local access.
problemAccountDevice=postavljeno kao uređaj povezan s Reolink računom
#: Fills {detail} above: the connection dropped for another reason.
problemLost=veza prekinuta

# Connection check
#: Under the Check button while the check runs.
checking=Provjera zvona…
#: Under the Check button when everything works.
checkOk=Sve radi: pritisak tipke, video i govor.
#: Under the Check button.
checkNotConfigured=Prvo unesite adresu, korisničko ime i lozinku.
#: Under the Check button. {host} is the doorbell's address.
checkUnreachable=Nije moguće doći do {host}. Provjerite adresu i nalazi li se zvono na istoj mreži.
#: Under the Check button.
checkLoginRefused=Zvono je odbilo korisničko ime ili lozinku.
#: Under the Check button. Keep the Reolink app's own menu names as your language's app shows them.
checkAccountDevice=Zvono je postavljeno kao Reolink 'uređaj povezan s računom', što blokira lokalni pristup. U aplikaciji Reolink vratite ga na lokalni uređaj.
#: Under the Check button, for a doorbell without Reolink's own protocol, whose button presses come over ONVIF. Use the menu names of the Reolink app in your language.
# TODO checkNoOnvifEvents=The doorbell does not send button presses: turn on ONVIF in the Reolink app (Settings > Network > Advanced > Server Settings).
#: Under the Check button. Use the menu names of the Reolink app in your language.
checkNoVideo=Pritisak tipke radi, ali video ne radi: uključite RTSP u aplikaciji Reolink (Postavke > Mreža > Napredno > Postavke poslužitelja).
#: Under the Check button. Use the menu names of the Reolink app in your language.
checkNoTalk=Pritisak tipke i video rade, ali zvono ne nudi kanal za govor: uključite ONVIF u aplikaciji Reolink (Postavke > Mreža > Napredno > Postavke poslužitelja).
#: Under the Check button. "Talk over", "Automatic" and "ONVIF" are setting names: keep them in English, as the settings page shows them.
checkNoBaichuanTalk=Pritisak tipke i video rade, ali zvono ne prihvaća govor preko Baichuana: postavite Talk over na Automatic ili ONVIF.
#: Under the Check button. {size} is a picture size such as 2560x1920. "Video" and "Sub (light)" are setting names: keep them in English.
checkMainTooLarge=Pritisak tipke i video rade, ali ovaj uređaj ne može reproducirati glavni stream ({size}): postavite Video na Sub (light).
#: Under the Check button. {size} is a picture size such as 2560x1920.
checkVideoTooLarge=Pritisak tipke i video rade, ali ovaj uređaj ne može reproducirati video zvona ({size}).
#: Under the Check button, when the doorbell sends its main stream as H.265. "Video" and "Sub (light)" are setting names: keep them in English.
# TODO checkMainH265=Button presses work, but the doorbell sends its main stream as H.265, which the plugin cannot play: set Video to Sub (light).
#: Under the Check button, when the doorbell sends its video as H.265.
# TODO checkVideoH265=Button presses work, but the doorbell sends its video as H.265, which the plugin cannot play.
#: Under the Check button. "Video over" and "RTSP" are setting names: keep them in English.
checkNoBaichuanVideo=Pritisak tipke radi, ali zvono ne šalje video preko Baichuana: postavite Video over to RTSP.
#: Under the Check button. "Video over" and "RTSP" are setting names: keep them in English.
checkVideoOverRtsp=Sve radi, ali video dolazi samo preko RTSP-a pa se slika prikazuje oko 2 sekunde kasnije: postavite Video over to RTSP.
#: Under the Check button when the Channel setting holds something that is not a number. "Channel" is a setting name: keep it in English.
checkBadChannel=Kanal mora biti broj, na primjer 1.
#: Under the Check button when the check stopped with an error. {detail} is a technical message in English.
checkFailed=Provjera nije uspjela: {detail}
