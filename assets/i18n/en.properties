# Reolink Doorbell Intercom: the plugin's own texts, in English. Every language file has these keys.
# To translate: copy this file to <language>.properties (such as pt-BR.properties), translate everything after
# the =, keep the {placeholders} as they are, and add the language to languages.properties. See the README.
# Texts left out of a translation show in English.

