# Reolink Doorbell Intercom: the plugin's own texts, in English. Every language file has these keys.
# A line starting with #: says where the text below it appears. To translate, see the README's Translations;
# texts left out of a translation show in English.

# Call screen
#: Button on the call screen while it rings: answers, turning on the speaker and the microphone.
answer=Answer
#: Button on the call screen: hear the doorbell without talking. In a call it turns the door sound on and off.
speaker=Speaker
#: Button in a call: turns your microphone on and off.
microphone=Microphone
#: Button while it rings: closes the call screen without answering.
hangUp=Hang up
#: Button in a call: ends the call and closes the call screen.
endCall=End call
#: Read out by screen readers after a button name, such as "Speaker, on".
on=on
#: Read out by screen readers after a button name, such as "Speaker, off".
off=off
#: Small red label at the top while the doorbell can hear you.
microphoneActive=Microphone active
#: Button in push-to-talk mode: the doorbell hears you only while you hold it. Keep it short.
holdToTalk=Talk
#: Shown for a moment after a tap on Talk that was too short.
holdToTalkHint=Hold the button to talk
#: Shown over the picture area while the call screen connects.
connecting=Connecting to the doorbell…
#: Shown when the doorbell is connected but has not sent a picture yet.
noPictureYet=No picture from the doorbell yet
#: Shown over the picture area. Two lines: a short title, then the reason. Keep the \n between them.
noVideo=No picture\nThe doorbell is not responding
#: Shown over a picture that stopped moving. Two lines: title, then reason. Keep the \n.
videoStopped=Picture frozen\nLost the connection to the doorbell
#: Shown when this device cannot decode the video. Two lines: title, then reason. Keep the \n.
videoNotShown=No picture\nThis device cannot play the video
#: Shown when the doorbell sends H.265 video. Two lines: title, then reason. Keep the \n.
videoH265=No picture\nThe doorbell sends H.265 video, which the viewer cannot play
#: Short notice at the top of the call screen when the sound from the doorbell stops.
doorbellSoundStopped=No sound from the doorbell
#: Short notice at the top of the call screen when the doorbell stops receiving your voice.
voiceNotThrough=Your voice isn't getting through
#: Short notice at the top of the call screen when no microphone works.
noMicrophone=Microphone not working
#: The doorbell's name at the top of the call screen when the user did not give one.
defaultName=Front door

# Cards
#: Label of a quick-action card the user did not name.
cardAction=Action
#: Under a quick-action card that must be held, so it is not run by accident.
holdToRun=Hold to run
#: Under a quick-action card for a moment after its action ran.
cardDone=Done
#: Under a quick-action card for a moment when its action failed.
cardFailed=Failed
#: Under a quick-action card when the Kiosk Satellite app is too old for it.
cardsNeedNewerKs=Needs a newer Kiosk Satellite
#: A Home Assistant device's state when Home Assistant cannot reach it.
unavailable=Unavailable
#: A Home Assistant device's state when it has none yet.
unknown=Unknown
#: State of a light or switch, under its card.
stateOn=On
#: State of a light or switch, under its card.
stateOff=Off
#: State of a door, window, gate or cover, under its card.
stateOpen=Open
#: State of a door, window, gate or cover, under its card.
stateClosed=Closed
#: State of a motion or presence sensor that sees something.
stateDetected=Detected
#: State of a motion or presence sensor that sees nothing: "no motion".
stateClear=Clear
#: State of a lock.
state.locked=Locked
#: State of a lock.
state.unlocked=Unlocked
#: State of a lock while it locks.
state.locking=Locking…
#: State of a lock while it unlocks.
state.unlocking=Unlocking…
#: State of a lock that got stuck.
state.jammed=Jammed
#: State of a garage door, gate or cover while it opens.
state.opening=Opening…
#: State of a garage door, gate or cover while it closes.
state.closing=Closing…
#: State of an alarm system that is off.
state.disarmed=Disarmed
#: State of an alarm system armed while people are at home.
state.armed_home=Armed home
#: State of an alarm system armed while nobody is home.
state.armed_away=Armed away
#: State of an alarm system armed for the night.
state.armed_night=Armed night
#: State of an alarm system armed for a holiday.
state.armed_vacation=Armed vacation
#: State of an alarm system armed with some zones left out.
state.armed_custom_bypass=Armed custom
#: State of an alarm system while it arms.
state.arming=Arming…
#: State of an alarm system while it disarms.
state.disarming=Disarming…
#: State of an alarm system counting down before it goes off.
state.pending=Pending…
#: State of an alarm system that went off.
state.triggered=Triggered

# Readings and status
#: Name of a reading in the plugin's status in Kiosk Satellite.
connectionReading=Doorbell connection
#: Name of a reading: when the doorbell last rang.
lastRingReading=Last ring
#: Name of a reading: how long the picture took to show after the last ring.
firstPictureReading=First picture
#: Value of the Doorbell connection reading.
connected=connected
#: Value of the Doorbell connection reading.
connectingState=connecting
#: Value of the Doorbell connection reading before the settings are filled in.
notConfigured=not configured
#: Value of the Last ring reading before the first ring.
noneYet=none yet
#: Value of the First picture reading while the picture is on its way.
waiting=waiting
#: Value of the First picture reading. {millis} is a number of milliseconds.
afterRing={millis} ms after the ring
#: The plugin's status before the settings are filled in.
enterSettings=Enter the doorbell's address, username and password
#: The plugin's status. {name} is the doorbell's name.
connectedTo=Connected to {name}
#: The plugin's status when something is wrong. {detail} is one of the short texts below.
doorbellProblem=Doorbell: {detail}
#: Fills {detail} above: the doorbell stopped answering.
problemNotAnswering=not answering
#: Fills {detail} above: the doorbell cannot be reached on the network.
problemUnreachable=not reachable
#: Fills {detail} above.
problemLogin=username or password refused
#: Fills {detail} above: the doorbell is linked to a Reolink cloud account, which blocks local access.
problemAccountDevice=set up as a Reolink account device
#: Fills {detail} above: the connection dropped for another reason.
problemLost=connection lost

# Connection check
#: Under the Check button while the check runs.
checking=Checking the doorbell…
#: Under the Check button when everything works.
checkOk=Everything works: button presses, video and talking.
#: Under the Check button.
checkNotConfigured=Fill in the address, username and password first.
#: Under the Check button. {host} is the doorbell's address.
checkUnreachable=Cannot reach {host}. Check the address, and that the doorbell is on the same network.
#: Under the Check button.
checkLoginRefused=The doorbell refused the username or password.
#: Under the Check button. Keep the Reolink app's own menu names as your language's app shows them.
checkAccountDevice=The doorbell is set up as a Reolink 'account device', which blocks local access. Switch it back to a local device in the Reolink app.
#: Under the Check button. Use the menu names of the Reolink app in your language.
checkNoVideo=Button presses work, but video does not: turn on RTSP in the Reolink app (Settings > Network > Advanced > Server Settings).
#: Under the Check button. Use the menu names of the Reolink app in your language.
checkNoTalk=Button presses and video work, but the doorbell offers no talk channel: turn on ONVIF in the Reolink app (Settings > Network > Advanced > Server Settings).
#: Under the Check button. "Talk over", "Automatic" and "ONVIF" are setting names: keep them in English, as the settings page shows them.
checkNoBaichuanTalk=Button presses and video work, but the doorbell does not accept talk over Baichuan: set Talk over to Automatic or ONVIF.
#: Under the Check button. {size} is a picture size such as 2560x1920. "Video" and "Sub (light)" are setting names: keep them in English.
checkMainTooLarge=Button presses and video work, but this device cannot play the main stream ({size}): set Video to Sub (light).
#: Under the Check button. {size} is a picture size such as 2560x1920.
checkVideoTooLarge=Button presses and video work, but this device cannot play the doorbell's video ({size}).
#: Under the Check button. "Video over" and "RTSP" are setting names: keep them in English.
checkNoBaichuanVideo=Button presses work, but the doorbell sends no video over Baichuan: set Video over to RTSP.
#: Under the Check button. "Video over" and "RTSP" are setting names: keep them in English.
checkVideoOverRtsp=Everything works, but video only comes over RTSP, so the picture shows about 2 seconds later: set Video over to RTSP.
#: Under the Check button when the check stopped with an error. {detail} is a technical message in English.
checkFailed=The check failed: {detail}
