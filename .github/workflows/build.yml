name: Release
# Releases are immutable, so the files go into a draft first and the workflow publishes it last:
# 1. Create a draft release for the new tag, with its notes: gh release create vX.Y.Z --draft --notes-file ...
# 2. Push the tag: git tag vX.Y.Z && git push origin vX.Y.Z
# 3. This workflow tests, builds, attaches the files to the draft and publishes it.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
# Actions are pinned by commit, with the version beside it: a moved tag cannot change what builds the shipped DEX
# (setup-android supplies d8 and android.jar) or the checksum made next to it. Update a pin by hand:
# gh api repos/<owner>/<action>/commits/<tag> --jq .sha
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20  # a hung test or upload fails the run, leaving the draft to retry
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false  # the steps that need the token get it from GH_TOKEN
      - name: Validate release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os

          if os.environ['GITHUB_REF_TYPE'] != 'tag':
              raise SystemExit('Run this workflow on a release tag, not a branch.')
          PY
          draft=$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft) || {
            echo "::error::No release for $GITHUB_REF_NAME. Create a draft release for the tag first."
            exit 1
          }
          if [ "$draft" != "true" ]; then
            echo "::error::The release for $GITHUB_REF_NAME is already published, and immutable releases cannot take files."
            exit 1
          fi
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad  # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd  # v4.0.4
      - name: Install Android build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Test
        run: python3 tools/test.py
      - name: Build
        run: python3 tools/build.py --android-platform 35 --version "${GITHUB_REF_NAME#v}"
      - name: Attach plugin assets to the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            dist/*.zip \
            dist/*.zip.sha256 \
            dist/kiosk-satellite-plugin.json --clobber
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest
